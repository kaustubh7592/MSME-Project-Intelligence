[project]
name = "msmeintel"
version = "0.1.0"
description = "Local Government MSME project intelligence learning platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.13,<5",
    "httpx>=0.28,<1",
    "lxml>=6,<7",
    "pdfplumber>=0.11,<0.12",
    "pypdf>=6,<7",
    "alembic>=1.17,<2",
    "psycopg[binary]>=3.2,<4",
    "sqlalchemy>=2.0,<3",
    "typer>=0.20,<1",
]

[dependency-groups]
dev = [
    "pytest>=8.4,<10",
    "ruff>=0.14,<1",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "msmeintel"
module-root = "src"

[tool.pytest.ini_options]
addopts = "-q -p no:cacheprovider"
testpaths = ["tests"]

[tool.ruff]
extend-exclude = [".agent", "docs"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

